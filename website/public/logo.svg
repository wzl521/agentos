<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#182038"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d6bfe"/>
      <stop offset="100%" stop-color="#8aa0ff"/>
    </linearGradient>
    <linearGradient id="hornGradSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b85ff"/>
      <stop offset="100%" stop-color="#a5b8ff"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形底 -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- 右角：外弧 r13 顺时针经右侧（3 点钟方向），内弧 r9.5 逆时针经右侧返回，构成月牙 -->
  <path d="M 36.45 19.78
           A 13 13 0 0 1 36.45 44.22
           A 9.5 9.5 0 0 0 35.25 23.07
           Z"
        fill="url(#hornGrad)" stroke-linejoin="round"/>

  <!-- 左角：镜像，经左侧（9 点钟方向） -->
  <path d="M 27.55 44.22
           A 13 13 0 0 1 27.55 19.78
           A 9.5 9.5 0 0 0 28.75 40.93
           Z"
        fill="url(#hornGradSoft)" stroke-linejoin="round"/>

  <!-- 终端光标：居中块状光标 -->
  <rect x="28.5" y="27" width="7" height="10.5" rx="1.8" fill="#ffffff"/>
</svg>
