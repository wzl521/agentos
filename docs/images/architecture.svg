<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <linearGradient id="accessGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d5aa0"/>
      <stop offset="100%" stop-color="#3b6fc4"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d94040"/>
      <stop offset="100%" stop-color="#e85d5d"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a6b52"/>
      <stop offset="100%" stop-color="#228b67"/>
    </linearGradient>
    <linearGradient id="foundGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a4a8a"/>
      <stop offset="100%" stop-color="#6b5ab0"/>
    </linearGradient>
    <linearGradient id="storageGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b5a3e"/>
      <stop offset="100%" stop-color="#8a7550"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-4%" width="104%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 5 5 L 10 0" fill="none" stroke="#8899aa" stroke-width="1.5"/>
    </marker>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 5 5 L 10 0" fill="none" stroke="#e85d5d" stroke-width="1.5"/>
    </marker>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" rx="10" fill="url(#bg)"/>

  <!-- Title -->
  <rect x="0" y="0" width="960" height="46" rx="10" fill="#1a1a2e"/>
  <rect x="0" y="23" width="960" height="23" fill="#1a1a2e"/>
  <text x="480" y="29" text-anchor="middle" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">OryxOS 整体架构</text>

  <!-- ====== LAYER 1: ACCESS ====== -->
  <rect x="30" y="56" width="900" height="78" rx="7" fill="url(#accessGrad)" fill-opacity="0.08" stroke="#3b6fc4" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="30" y="56" width="900" height="24" rx="7" fill="url(#accessGrad)" fill-opacity="0.15"/>
  <rect x="30" y="66" width="900" height="14" fill="url(#accessGrad)" fill-opacity="0.15"/>
  <text x="46" y="73" fill="#2d5aa0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">接入层</text>

  <!-- CLI -->
  <rect x="50" y="88" width="400" height="36" rx="5" fill="url(#cardBg)" filter="url(#cardShadow)" stroke="#e0e4ea" stroke-width="0.5"/>
  <circle cx="66" cy="106" r="4" fill="#3b6fc4" opacity="0.7"/>
  <text x="78" y="110" fill="#1a1a2e" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">CLI Channel</text>
  <text x="280" y="110" fill="#8899aa" font-family="Helvetica, Arial, sans-serif" font-size="10.5">oryxos chat  ·  交互式对话  ·  本地调试</text>

  <!-- Web Service -->
  <rect x="470" y="88" width="440" height="36" rx="5" fill="url(#cardBg)" filter="url(#cardShadow)" stroke="#e0e4ea" stroke-width="0.5"/>
  <circle cx="486" cy="106" r="4" fill="#3b6fc4" opacity="0.7"/>
  <text x="498" y="110" fill="#1a1a2e" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">Web Service</text>
  <text x="700" y="110" fill="#8899aa" font-family="Helvetica, Arial, sans-serif" font-size="10.5">REST API  ·  10 个端点  ·  业务系统集成</text>

  <!-- Access → Engine arrow -->
  <line x1="480" y1="134" x2="480" y2="148" stroke="#8899aa" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- ====== LAYER 2: ENGINE ====== -->
  <rect x="30" y="152" width="900" height="120" rx="7" fill="url(#engineGrad)" fill-opacity="0.06" stroke="#e85d5d" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="30" y="152" width="900" height="24" rx="7" fill="url(#engineGrad)" fill-opacity="0.12"/>
  <rect x="30" y="162" width="900" height="14" fill="url(#engineGrad)" fill-opacity="0.12"/>
  <text x="46" y="169" fill="#c04040" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">引擎层 — Agent 大脑</text>

  <!-- ReActLoop -->
  <rect x="50" y="184" width="220" height="56" rx="5" fill="url(#cardBg)" filter="url(#cardShadow)" stroke="#e0e4ea" stroke-width="0.5"/>
  <rect x="50" y="184" width="220" height="22" rx="5" fill="#e85d5d" fill-opacity="0.08"/>
  <rect x="50" y="198" width="220" height="8" fill="#e85d5d" fill-opacity="0.08"/>
  <text x="160" y="200" text-anchor="middle" fill="#c04040" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">ReActLoop</text>
  <text x="160" y="218" text-anchor="middle" fill="#667788" font-family="Helvetica, Arial, sans-serif" font-size="10">核心循环引擎 · 迭代控制</text>
  <text x="160" y="232" text-anchor="middle" fill="#99aabb" font-family="Helvetica, Arial, sans-serif" font-size="9.5">默认最大 10 次迭代</text>

  <!-- ReActLoop → PromptBuilder arrow -->
  <line x1="276" y1="212" x2="306" y2="212" stroke="#e85d5d" stroke-width="1.3" stroke-opacity="0.5" marker-end="url(#arrowFlow)"/>

  <!-- PromptBuilder -->
  <rect x="312" y="184" width="220" height="56" rx="5" fill="url(#cardBg)" filter="url(#cardShadow)" stroke="#e0e4ea" stroke-width="0.5"/>
  <rect x="312" y="184" width="220" height="22" rx="5" fill="#e85d5d" fill-opacity="0.08"/>
  <rect x="312" y="198" width="220" height="8" fill="#e85d5d" fill-opacity="0.08"/>
  <text x="422" y="200" text-anchor="middle" fill="#c04040" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">PromptBuilder</text>
  <text x="422" y="218" text-anchor="middle" fill="#667788" font-family="Helvetica, Arial, sans-serif" font-size="9.5">System Prompt + Bootstrap + Skill</text>
  <text x="422" y="232" text-anchor="middle" fill="#99aabb" font-family="Helvetica, Arial, sans-serif" font-size="9">+ Memory + 对话历史 + Tool 列表</text>

  <!-- PromptBuilder → ToolExecutor arrow -->
  <line x1="538" y1="212" x2="568" y2="212" stroke="#e85d5d" stroke-width="1.3" stroke-opacity="0.5" marker-end="url(#arrowFlow)"/>

  <!-- ToolExecutor -->
  <rect x="574" y="184" width="220" height="56" rx="5" fill="url(#cardBg)" filter="url(#cardShadow)" stroke="#e0e4ea" stroke-width="0.5"/>
  <rect x="574" y="184" width="220" height="22" rx="5" fill="#e85d5d" fill-opacity="0.08"/>
  <rect x="574" y="198" width="220" height="8" fill="#e85d5d" fill-opacity="0.08"/>
  <text x="684" y="200" text-anchor="middle" fill="#c04040" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">ToolExecutor</text>
  <text x="684" y="218" text-anchor="middle" fill="#667788" font-family="Helvetica, Arial, sans-serif" font-size="10">Tool 调度 · 沙箱检查 · 审计落库</text>
  <text x="684" y="232" text-anchor="middle" fill="#99aabb" font-family="Helvetica, Arial, sans-serif" font-size="9.5">失败重试 · 结果回传</text>

  <!-- ContextLoader -->
  <rect x="372" y="246" width="100" height="18" rx="3" fill="#e85d5d" fill-opacity="0.06" stroke="#e85d5d" stroke-opacity="0.15" stroke-width="0.5"/>
  <text x="422" y="258" text-anchor="middle" fill="#c04040" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="600">ContextLoader</text>
  <line x1="422" y1="240" x2="422" y2="246" stroke="#e85d5d" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Engine → Capability (3 arrows down) -->
  <line x1="160" y1="272" x2="160" y2="288" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arrowDown)"/>
  <line x1="422" y1="272" x2="422" y2="288" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arrowDown)"/>
  <line x1="684" y1="272" x2="684" y2="288" stroke="#8899aa" stroke-width="1.2" marker-end="url(#arrowDown)"/>

  <!-- ====== LAYER 3: CAPABILITY ====== -->
  <rect x="30" y="292" width="900" height="78" rx="7" fill="url(#capGrad)" fill-opacity="0.06" stroke="#228b67" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="30" y="292" width="900" height="24" rx="7" fill="url(#capGrad)" fill-opacity="0.12"/>
  <rect x="30" y="302" width="900" height="14" fill="url(#capGrad)" fill-opacity="0.12"/>
  <text x="46" y="309" fill="#1a6b52" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">能力层</text>

  <!-- Provider -->
  <rect x="50" y="324" width="260" height="36" rx="5" fill="url(#cardBg)" filter="url(#cardShadow)" stroke="#e0e4ea" stroke-width="0.5"/>
  <circle cx="66" cy="342" r="4" fill="#228b67" opacity="0.7"/>
  <text x="78" y="346" fill="#1a1a2e" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Provider</text>
  <text x="180" y="346" fill="#8899aa" font-family="Helvetica, Arial, sans-serif" font-size="10">LLM 调用  ·  多模型路由  ·  显式映射</text>

  <!-- Memory -->
  <rect x="330" y="324" width="260" height="36" rx="5" fill="url(#cardBg)" filter="url(#cardShadow)" stroke="#e0e4ea" stroke-width="0.5"/>
  <circle cx="346" cy="342" r="4" fill="#228b67" opacity="0.7"/>
  <text x="358" y="346" fill="#1a1a2e" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Memory</text>
  <text x="460" y="346" fill="#8899aa" font-family="Helvetica, Arial, sans-serif" font-size="10">会话记忆  ·  长期记忆  ·  三层门面</text>

  <!-- Tool -->
  <rect x="610" y="324" width="300" height="36" rx="5" fill="url(#cardBg)" filter="url(#cardShadow)" stroke="#e0e4ea" stroke-width="0.5"/>
  <circle cx="626" cy="342" r="4" fill="#228b67" opacity="0.7"/>
  <text x="638" y="346" fill="#1a1a2e" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Tool</text>
  <text x="740" y="346" fill="#8899aa" font-family="Helvetica, Arial, sans-serif" font-size="10">内置 Tool  ·  MCP Client  ·  沙箱</text>

  <!-- Capability → Foundation arrow -->
  <line x1="480" y1="370" x2="480" y2="386" stroke="#8899aa" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- ====== LAYER 4: FOUNDATION ====== -->
  <rect x="30" y="390" width="900" height="56" rx="7" fill="url(#foundGrad)" fill-opacity="0.06" stroke="#6b5ab0" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="30" y="390" width="900" height="24" rx="7" fill="url(#foundGrad)" fill-opacity="0.12"/>
  <rect x="30" y="400" width="900" height="14" fill="url(#foundGrad)" fill-opacity="0.12"/>
  <text x="46" y="407" fill="#5a4a8a" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">基础层</text>

  <rect x="50" y="416" width="210" height="22" rx="4" fill="url(#cardBg)" stroke="#e0e4ea" stroke-width="0.5"/>
  <text x="155" y="431" text-anchor="middle" fill="#445566" font-family="Helvetica, Arial, sans-serif" font-size="10">Profile · Bootstrap · Skill 加载</text>

  <rect x="275" y="416" width="200" height="22" rx="4" fill="url(#cardBg)" stroke="#e0e4ea" stroke-width="0.5"/>
  <text x="375" y="431" text-anchor="middle" fill="#445566" font-family="Helvetica, Arial, sans-serif" font-size="10">Session 管理 · SQLite 持久化</text>

  <rect x="490" y="416" width="200" height="22" rx="4" fill="url(#cardBg)" stroke="#e0e4ea" stroke-width="0.5"/>
  <text x="590" y="431" text-anchor="middle" fill="#445566" font-family="Helvetica, Arial, sans-serif" font-size="10">配置与密钥加载 · 环境变量</text>

  <rect x="705" y="416" width="205" height="22" rx="4" fill="url(#cardBg)" stroke="#e0e4ea" stroke-width="0.5"/>
  <text x="807" y="431" text-anchor="middle" fill="#445566" font-family="Helvetica, Arial, sans-serif" font-size="10">结构化日志 · 健康检查</text>

  <!-- ====== LAYER 5: STORAGE ====== -->
  <rect x="30" y="454" width="900" height="56" rx="7" fill="url(#storageGrad)" fill-opacity="0.06" stroke="#8a7550" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="30" y="454" width="900" height="24" rx="7" fill="url(#storageGrad)" fill-opacity="0.12"/>
  <rect x="30" y="464" width="900" height="14" fill="url(#storageGrad)" fill-opacity="0.12"/>
  <text x="46" y="471" fill="#6b5a3e" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">存储层</text>

  <rect x="50" y="480" width="210" height="22" rx="4" fill="url(#cardBg)" stroke="#e0e4ea" stroke-width="0.5"/>
  <text x="155" y="495" text-anchor="middle" fill="#445566" font-family="Helvetica, Arial, sans-serif" font-size="9.5">sessions  /  tool_invocations  /  llm_calls</text>

  <rect x="275" y="480" width="185" height="22" rx="4" fill="url(#cardBg)" stroke="#e0e4ea" stroke-width="0.5"/>
  <text x="367" y="495" text-anchor="middle" fill="#445566" font-family="Helvetica, Arial, sans-serif" font-size="9.5">.oryxos/  ·  MEMORY.md</text>

  <rect x="475" y="480" width="185" height="22" rx="4" fill="url(#cardBg)" stroke="#e0e4ea" stroke-width="0.5"/>
  <text x="567" y="495" text-anchor="middle" fill="#445566" font-family="Helvetica, Arial, sans-serif" font-size="9.5">Profile YAML  ·  SKILL.md</text>

  <rect x="675" y="480" width="235" height="22" rx="4" fill="url(#cardBg)" stroke="#e0e4ea" stroke-width="0.5"/>
  <text x="792" y="495" text-anchor="middle" fill="#445566" font-family="Helvetica, Arial, sans-serif" font-size="9.5">Bootstrap: AGENTS / SOUL / USER.md</text>

  <!-- ====== EXTERNAL DEPENDENCIES ====== -->
  <!-- LLM Providers label -->
  <rect x="930" y="310" width="30" height="64" rx="4" fill="#f0f4f8" stroke="#228b67" stroke-opacity="0.3" stroke-width="1"/>
  <text x="945" y="328" text-anchor="middle" fill="#1a6b52" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600">外</text>
  <text x="945" y="340" text-anchor="middle" fill="#1a6b52" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600">部</text>
  <text x="945" y="352" text-anchor="middle" fill="#1a6b52" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600">L</text>
  <text x="945" y="364" text-anchor="middle" fill="#1a6b52" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600">M</text>

  <!-- MCP label -->
  <rect x="930" y="390" width="30" height="32" rx="4" fill="#f0f4f8" stroke="#228b67" stroke-opacity="0.3" stroke-width="1"/>
  <text x="945" y="404" text-anchor="middle" fill="#1a6b52" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600">M</text>
  <text x="945" y="416" text-anchor="middle" fill="#1a6b52" font-family="Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600">P</text>

  <!-- Dashed lines to external -->
  <line x1="310" y1="342" x2="930" y2="342" stroke="#228b67" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="5,4"/>
  <line x1="910" y1="406" x2="930" y2="406" stroke="#228b67" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="5,4"/>

  <!-- ====== DATA FLOW LEGEND ====== -->
  <rect x="30" y="520" width="900" height="48" rx="6" fill="#1a1a2e" fill-opacity="0.03" stroke="#d0d5dd" stroke-width="0.5"/>

  <text x="60" y="538" fill="#445566" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700">消息流</text>
  <line x1="105" y1="535" x2="150" y2="535" stroke="#e85d5d" stroke-width="1.3" marker-end="url(#arrowFlow)"/>
  <text x="162" y="539" fill="#667788" font-family="Helvetica, Arial, sans-serif" font-size="9.5">用户消息 → Channel → ReActLoop → PromptBuilder → ProviderService → LLM</text>

  <text x="60" y="555" fill="#445566" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700">Tool 流</text>
  <line x1="105" y1="552" x2="150" y2="552" stroke="#e85d5d" stroke-width="1.3" marker-end="url(#arrowFlow)"/>
  <text x="162" y="556" fill="#667788" font-family="Helvetica, Arial, sans-serif" font-size="9.5">LLM Tool Call → ToolExecutor → SandboxChecker → 执行 → 结果回填 → 继续推理</text>

  <!-- Bottom summary -->
  <text x="480" y="596" text-anchor="middle" fill="#99aabb" font-family="Helvetica, Arial, sans-serif" font-size="10.5">
    Provider、Memory、Tool 三个能力供养 ReAct 循环引擎，引擎跑出的能力通过 CLI 和 Web Service 两个入口对外提供
  </text>
  <text x="480" y="614" text-anchor="middle" fill="#ccd5de" font-family="Helvetica, Arial, sans-serif" font-size="9.5">
    所有能力收敛到一个进程、一套存储，单二进制部署  ·  外部依赖（LLM API、MCP Server）在应用边界之外
  </text>
</svg>